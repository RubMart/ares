# Ejemplo de reverse proxy ARES (nginx en Docker o en el host).
# Montar COGs en /var/www/data (p. ej. volumen ./data:/var/www/data:ro).
# cog_url en catálogo: http://localhost:7070/data/<fichero>.tif

upstream ares_frontend {
    server frontend:3000;
}

upstream ares_api {
    server api:8000;
}

server {
    listen 80;
    # Sin server_name por ahora (cualquier Host).

    # En producción: redirigir a HTTPS o usar este bloque solo en 443 con ssl_*.
    # listen 443 ssl http2;
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 1m;

    # --- Ortofotos COG (HTTP Range + CORS para el visor) ---
    # URL pública: http://localhost:7070/data/capa_cog.tif
    location /data/ {
        alias /var/www/data/;
        types { image/tiff tif tiff; }
        default_type image/tiff;

        # nginx ya envía Accept-Ranges: bytes en estáticos;
        # Range → 206 Partial Content (necesario para COG).
        add_header Accept-Ranges bytes always;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Origin, Accept" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Range, Origin, Accept";
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        # Evitar listado de directorio en producción si no lo quieres público
        autoindex off;
    }

    # --- API FastAPI (sin prefijo interno; /api/search → /search) ---
    location /api/ {
        proxy_pass http://ares_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # CLIP / Ollama pueden tardar
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # --- Frontend Next.js ---
    location / {
        proxy_pass http://ares_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
